<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TDK</title>
<meta name="application-name" content="TDK">
<meta name="apple-mobile-web-app-title" content="TDK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8400b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: jednosloupcová pracovní karta pro telefon, vstupy nahoře, výsledek hned pod nimi. */
:root {
  color-scheme: light;
  --bg: #eceff2;
  --surface: #ffffff;
  --field: #f3f5f7;
  --ink: #14202b;
  --muted: #5a6977;
  --line: #cdd5dc;
  --accent: #c8400b;
  --accent-ink: #ffffff;
  --good: #1d7a4a;
  --font-display: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e151b; --surface: #17212a; --field: #0f1920; --ink: #e8eef3;
    --muted: #93a3b1; --line: #2b3a46; --accent: #ff7a3d; --accent-ink: #1a0d05; --good: #4cc489;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  min-height: 100vh;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 14px; }
.mark { width: 56px; height: 56px; flex: none; color: var(--ink); }
.title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 40px; line-height: 1; margin: 0; font-weight: 700; text-wrap: balance; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label, .lbl { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type="number"], input[type="text"] {
  width: 100%; min-width: 0; height: 52px; padding: 0 12px;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;
}
input[type="text"] { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-transform: uppercase; }
input.numtxt[type="text"] { font-family: var(--font-num); font-size: 22px; font-weight: 600; text-transform: none; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.stepper button { height: 52px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--ink); font: 700 28px var(--font-display); cursor: pointer; }
.stepper input { text-align: center; }
input:focus-visible, .stepper button:focus-visible, .seg button:focus-visible, .reset:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 13px; color: var(--muted); }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--field); border: 1px solid var(--line); border-radius: 4px; }
.total b { font-family: var(--font-num); font-size: 28px; font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { height: 52px; border: 0; background: var(--field); color: var(--ink); font-family: var(--font-display); font-size: 26px; font-weight: 700; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.result { gap: 12px; border-color: var(--accent); border-width: 2px; }
.result .big { font-family: var(--font-num); font-weight: 600; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; overflow-wrap: anywhere; }
.result .unit { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--muted); margin-left: 6px; }
.formula { font-family: var(--font-num); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 14px; background: var(--field); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.bar.done > i { background: var(--good); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-num); font-size: 22px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.reset { align-self: flex-start; height: 44px; padding: 0 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: 600 15px var(--font-body); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Průběžná pec s lodičkami">
      <rect x="4" y="14" width="56" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="4"/>
      <path d="M4 40h56" stroke="currentColor" stroke-width="3"/>
      <rect x="11" y="27" width="10" height="10" rx="1.5" fill="var(--accent)"/>
      <rect x="27" y="27" width="10" height="10" rx="1.5" fill="var(--accent)"/>
      <rect x="43" y="27" width="10" height="10" rx="1.5" fill="var(--accent)"/>
      <path d="M12 46h40M46 43l6 3-6 3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="title">
      <span class="eyebrow">Keramika · průběžné pece</span>
      <h1>Výkon pecí</h1>
    </div>
  </header>

  <section class="panel" aria-label="Vstupy">
    <div class="field">
      <label for="pec">Pec</label>
      <input id="pec" type="text" maxlength="8" placeholder="např. D15" autocomplete="off" autocapitalize="characters">
    </div>

    <div class="field">
      <label for="posuvy">Posuvů v peci</label>
      <input id="posuvy" type="number" inputmode="numeric" min="0" step="1">
    </div>

    <div class="row2">
      <div class="field">
        <label for="od">Od</label>
        <input id="od" class="numtxt" type="text" inputmode="text" maxlength="12" placeholder="447/47" autocomplete="off">
      </div>
      <div class="field">
        <label for="do">Do</label>
        <input id="do" class="numtxt" type="text" inputmode="text" maxlength="12" placeholder="417/17" autocomplete="off">
      </div>
    </div>
    <div class="total"><span class="lbl">Celkem posuvů</span><b id="celkem">0</b></div>
    <span class="hint" id="rozsah-hint"></span>

    <div class="field">
      <span class="lbl" id="drahy-l">Počet drah</span>
      <div class="seg" role="group" aria-labelledby="drahy-l" id="drahy">
        <button type="button" data-v="1" aria-pressed="false">1</button>
        <button type="button" data-v="2" aria-pressed="false">2</button>
        <button type="button" data-v="3" aria-pressed="false">3</button>
      </div>
      <span class="hint" id="hint"></span>
    </div>

    <div class="field">
      <label for="kusy">Kusy na lodičce</label>
      <input id="kusy" type="number" inputmode="numeric" min="0" step="1">
    </div>

    <div class="field">
      <label for="extra">Lodičky navíc nebo méně</label>
      <div class="stepper">
        <button type="button" id="extra-minus" aria-label="Ubrat lodičku">−</button>
        <input id="extra" type="number" inputmode="numeric" step="1" placeholder="0">
        <button type="button" id="extra-plus" aria-label="Přidat lodičku">+</button>
      </div>
      <span class="hint">Plus přidá lodičky, mínus je odečte. Každá je jedny kusy na lodičce a nenásobí se dráhami.</span>
    </div>
  </section>

  <section class="panel result" aria-live="polite" aria-label="Výsledek">
    <span class="lbl" id="vysl-l">Výkon</span>
    <div><span class="big" id="out">0</span><span class="unit">ks</span></div>
    <div class="formula" id="formula"></div>
    <div class="bar" id="bar" role="img" aria-label="Splnění posuvů"><i id="fill"></i></div>
    <div class="stats">
      <div class="stat"><span class="lbl">Splněno</span><b id="pct">0 %</b></div>
      <div class="stat"><span class="lbl">Plán pece</span><b id="plan">0 ks</b></div>
    </div>
  </section>

  <button class="reset" id="reset" type="button">Nová směna</button>
</main>

<script>
var $ = function (id) { return document.getElementById(id); };
var fmt = new Intl.NumberFormat("cs-CZ");
var drahy = 2;
var KEY = "tdk-vykon-pecí";

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      pec: $("pec").value, posuvy: $("posuvy").value, od: $("od").value, "do": $("do").value,
      drahy: drahy, kusy: $("kusy").value, extra: $("extra").value
    }));
  } catch (e) {}
}
function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; }
}
function setDrahy(n) {
  drahy = n;
  Array.prototype.forEach.call($("drahy").children, function (b) {
    b.setAttribute("aria-pressed", String(+b.dataset.v === n));
  });
}
function num(id) { var v = parseFloat($(id).value); return isNaN(v) || v < 0 ? 0 : v; }

/* "447/47" -> [447, 47]; chybějící druhé číslo je null */
function cisla(s) {
  var m = String(s).match(/\d+/g) || [];
  return [m.length > 0 ? +m[0] : null, m.length > 1 ? +m[1] : null];
}
/* Čísla posuvů jedou dopředu a po posledním posuvu v peci se vrací na začátek,
   proto se rozdíl počítá v kruhu o velikosti "posuvů v peci". */
function rozsah() {
  var n = num("posuvy");
  var a = cisla($("od").value), b = cisla($("do").value);
  function rozdil(x, y) { return n > 0 ? (((y - x) % n) + n) % n : Math.abs(y - x); }
  var h = (a[0] !== null && b[0] !== null) ? rozdil(a[0], b[0]) : 0;
  var warn = "";
  if (a[0] !== null && b[0] !== null && a[1] !== null && b[1] !== null) {
    var h2 = rozdil(a[1], b[1]);
    if (h2 !== h) warn = "Druhá čísla dávají " + h2 + " posuvů, první " + h + ". Zkontroluj zadání.";
  }
  return { hotovo: h, warn: warn };
}

function calc() {
  var posuvy = num("posuvy"), kusy = num("kusy"), extra = parseInt($("extra").value, 10) || 0;
  var r = rozsah(), hotovo = r.hotovo;
  $("celkem").textContent = fmt.format(hotovo);
  $("rozsah-hint").textContent = r.warn || "Zadej čísla posuvů jako 447/47. Počítá se dopředu a po posledním posuvu v peci se číslování vrací na začátek.";
  var vykon = Math.max(0, hotovo * drahy * kusy + extra * kusy);
  var plan = posuvy * drahy * kusy;
  var pct = posuvy > 0 ? Math.round(hotovo / posuvy * 1000) / 10 : 0;
  var pec = $("pec").value.trim();
  $("vysl-l").textContent = pec ? "Výkon · pec " + pec.toUpperCase() : "Výkon";
  $("out").textContent = fmt.format(vykon);
  $("formula").textContent = fmt.format(hotovo) + " posuvů × " + drahy + (drahy === 1 ? " dráha" : " dráhy") + " × " + fmt.format(kusy) + " ks"
    + (extra ? (extra > 0 ? " + " : " − ") + fmt.format(Math.abs(extra)) + " " + (Math.abs(extra) === 1 ? "lodička" : Math.abs(extra) < 5 ? "lodičky" : "lodiček") + " × " + fmt.format(kusy) + " ks" : "");
  $("plan").textContent = fmt.format(plan) + " ks";
  $("pct").textContent = fmt.format(pct) + " %";
  $("fill").style.width = Math.min(100, pct) + "%";
  $("bar").classList.toggle("done", pct >= 100);
  $("hint").textContent = drahy === 1 ? "Jedna dráha se nenásobí." : "Výsledek se násobí × " + drahy + ".";
  save();
}

(function init() {
  var s = load();
  if (s) {
    $("pec").value = s.pec || ""; $("posuvy").value = s.posuvy;
    $("od").value = s.od || ""; $("do").value = s["do"] || "";
    $("kusy").value = s.kusy; $("extra").value = s.extra || ""; setDrahy(+s.drahy || 2);
  } else {
    $("pec").value = "D15"; $("posuvy").value = 100;
    $("od").value = "447/47"; $("do").value = "417/17";
    $("kusy").value = 60; setDrahy(2);
  }
  calc();
  ["pec", "posuvy", "od", "do", "kusy", "extra"].forEach(function (id) { $(id).addEventListener("input", calc); });
  $("drahy").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    setDrahy(+b.dataset.v); calc();
  });
  function krok(d) { $("extra").value = (parseInt($("extra").value, 10) || 0) + d; calc(); }
  $("extra-minus").addEventListener("click", function () { krok(-1); });
  $("extra-plus").addEventListener("click", function () { krok(1); });
  $("reset").addEventListener("click", function () { $("od").value = ""; $("do").value = ""; $("extra").value = ""; calc(); $("od").focus(); });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
